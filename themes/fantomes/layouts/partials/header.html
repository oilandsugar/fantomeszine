<!doctype html>
<!--
    fantomes theme for hugo by Lizbeth Poirier
    fantomeszine.com
-->
<html lang="en">
  <head itemscope itemtype="{{ .Site.BaseURL }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ hugo.Generator }}
    {{ with .OutputFormats.Get "rss" -}}
        {{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
    {{ end -}}
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="stylesheet" type="text/css" href="{{ "css/style.css" | relURL }}">
    <link rel="preconnect" href="https://app.snipcart.com">
    <link rel="preconnect" href="https://cdn.snipcart.com">
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.2.0/default/snipcart.css" />
    <link rel="stylesheet" href="{{ "css/snipcart-theme.css" | relURL }}">
    <a rel="me" class="mastodon" href="https://merveilles.town/@ritualdust">Mastodon</a>
    {{ partial "meta" .}}
  </head>
    <body>
      <div class="wrap">
        <header>
          <div class="left-border">
            <img src="/img/border-left.png"/>
          </div>
          <div class="right-border">
            <img src="/img/border-right.png"/>
          </div>
          <div class="logo">
            <h1>
              <a href="/" title="Back to home page" aria-label="Back to home page">
                <img
                  src="/img/fantomes.png"
                  width="400"
                  alt="Fantômes zine hand-drawn logo"
                />
              </a>
            </h1>
          </div>
          {{ partial "menu" . }}
        </header>
